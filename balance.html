
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EBF0FF">
  <title>Financial Dashboard | NIM LEASING</title>

  <style>
    :root {
      --background: #EBF0FF;
      --primary: #4D7CFF;
      --text: #4A5568;
      --muted: #7E8CA2;
      --income: #2B6CB0;
      --expense: #C53030;
      --balance: #2F855A;
      --white: #FFFFFF;
      --line: #D2D9EE;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px 36px;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI",
                   Tahoma, sans-serif;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      padding: 18px 6px 16px;
    }

    .brand {
      color: var(--primary);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 6px 16px;
      font-size: 11px;
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 30px;
      background: #FFFFFF;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #D69E2E;
    }

    .dot.online { background: #38A169; }
    .dot.offline { background: #E53E3E; }

    .section-title {
      margin: 20px 4px 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      min-width: 0;
      background: var(--white);
      border-radius: 14px;
      padding: 15px 14px;
      box-shadow: 0 3px 12px rgba(50, 70, 120, .045);
    }

    .card-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .amount {
      margin-top: 12px;
      font-size: clamp(17px, 4.4vw, 23px);
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .income { color: var(--income); }
    .expense { color: var(--expense); }
    .balance { color: var(--balance); }
    .primary { color: var(--primary); }

    .wide {
      margin-top: 12px;
    }

    .wide .amount {
      text-align: right;
      font-size: clamp(20px, 5vw, 26px);
    }

    .overview-card {
      display: grid;
      gap: 15px;
    }

    .overview-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .overview-row .amount {
      margin: 0;
      text-align: right;
      font-size: 17px;
    }

    .divider {
      height: 1px;
      background: var(--line);
    }

    .member-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 2px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .count {
      padding: 5px 9px;
      background: #FFFFFF;
      border-radius: 20px;
      color: var(--primary);
      white-space: nowrap;
    }

    .member-list {
      display: grid;
      gap: 8px;
    }

    .member {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      border-radius: 12px;
      padding: 12px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #EBF0FF;
      color: var(--primary);
      font-weight: 800;
    }

    .member-info {
      min-width: 0;
      flex: 1;
    }

    .member-name {
      font-size: 13px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .member-method {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .empty, .error-box {
      background: #FFFFFF;
      padding: 18px 14px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .error-box { color: var(--expense); }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.8;
    }

    .fund-label {
      display: inline-block;
      margin-bottom: 9px;
      background: var(--primary);
      color: white;
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 750;
      font-size: 12px;
    }

    @media (max-width: 350px) {
      .grid { grid-template-columns: 1fr; }
      .brand { font-size: 20px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="brand">Financial Dashboard</div>
      <div class="subtitle" id="monthLabel">
        กำลังโหลดข้อมูล...
      </div>
    </header>

    <div class="status-row">
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">กำลังเชื่อมต่อ...</span>
      </div>
      <span id="updatedAt">กำลังเชื่อมต่อ...</span>
    </div>

    <div id="errorBox" class="error-box" hidden></div>

    <div class="section-title">ภาพรวมทั้งหมด</div>

    <section class="grid">
      <article class="card">
        <div class="card-label">
          <span>📈</span><span>รายรับรวม</span>
        </div>
        <div class="amount income" id="incomeTotal">—</div>
      </article>

      <article class="card">
        <div class="card-label">
          <span>📉</span><span>รายจ่ายรวม</span>
        </div>
        <div class="amount expense" id="expenseTotal">—</div>
      </article>
    </section>

    <article class="card wide">
      <div class="card-label">
        <span>💰</span><span>คงเหลือทั้งหมด</span>
      </div>
      <div class="amount primary" id="balanceTotal">—</div>
    </article>

    <div class="member-summary">
      <span>👥 ใครจ่ายแล้วบ้าง?</span>
      <span class="count" id="memberCount">0 คน</span>
    </div>

    <section class="member-list" id="memberList">
      <div class="empty">กำลังโหลดรายชื่อสมาชิก...</div>
    </section>

    <footer class="footer">
      <div class="fund-label">กองทุนสำรองเลี้ยงห้อง (No Refund)</div>
      <div> ขุนศรีวีรปัญญ์โกสีย์ • Financial Dashboard</div>
    </footer>

  </main>

  <script>
    'use strict';

    // เปลี่ยนเป็น URL /exec ของ Apps Script ที่ Deploy แล้ว
    const API_URL =
      'https://script.google.com/macros/s/AKfycbzjjHXZtUAnuUD3Dp4UdD5qn2sPClUitl8swFIF1IMKAw-zdjZW93hYCwUtn5KY6UQ/exec';

    const POLL_INTERVAL = 5000;

    const query = new URLSearchParams(window.location.search);

    const requestedMonth = query.get('month') || '';
    const requestedYear = query.get('year') || '';

    let timer = null;
    let requestNumber = 0;
    let latestRenderedRequest = 0;
    let isLoading = false;
    let lastData = null;

    const $ = function (id) {
      return document.getElementById(id);
    };

    function money(value) {
      const n = Number(value || 0);

      return n.toLocaleString('th-TH', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' บาท';
    }

    function setStatus(state, text) {
      $('statusDot').className = 'dot ' +
        (state === 'online' ? 'online' :
         state === 'offline' ? 'offline' : '');

      $('statusText').textContent = text;
    }

    function setError(message) {
      const box = $('errorBox');

      if (message) {
        box.textContent = message;
        box.hidden = false;
      } else {
        box.textContent = '';
        box.hidden = true;
      }
    }

    function renderMembers(members) {
      const list = $('memberList');
      const items = Array.isArray(members) ? members : [];

      $('memberCount').textContent = items.length + ' คน';

      if (!items.length) {
        list.innerHTML =
          '<div class="empty">ยังไม่มีรายชื่อผู้ชำระเงินในเดือนนี้</div>';
        return;
      }

      // สร้าง DOM ด้วย textContent เพื่อไม่ให้ชื่อสมาชิก
      // ถูกตีความเป็น HTML
      list.replaceChildren();

      items.forEach(function (member) {
        const row = document.createElement('article');
        row.className = 'member';

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = String(member.name || '?').trim()
          .charAt(0) || '?';

        const info = document.createElement('div');
        info.className = 'member-info';

        const name = document.createElement('div');
        name.className = 'member-name';
        name.textContent = member.name || 'ไม่ระบุชื่อ';

        const method = document.createElement('div');
        method.className = 'member-method';
        method.textContent = 'วิธีชำระ: ' +
          (member.method || 'ไม่ระบุ');

        info.append(name, method);
        row.append(avatar, info);
        list.appendChild(row);
      });
    }

    function renderDashboard(data) {
      $('monthLabel').textContent =
        'ข้อมูลประจำเดือน ' +
        (data.thaiMonthLabel || data.monthLabel || '');

      $('incomeTotal').textContent = money(data.incomeTotal);
      $('expenseTotal').textContent = money(data.expenseTotal);
      $('balanceTotal').textContent = money(data.balanceTotal);

      renderMembers(data.paidMembers);

      $('updatedAt').textContent =
        'อัปเดตล่าสุด ' +
        new Date().toLocaleTimeString('th-TH', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });

      lastData = data;
      setStatus('online', 'เชื่อมต่อแล้ว');
      setError('');
    }

    function loadDashboard() {
      if (isLoading) return;

      if (!API_URL ||
          API_URL.indexOf('PASTE_YOUR_') === 0 ||
          API_URL.indexOf('/exec') === -1) {
        setStatus('offline', 'ยังไม่ได้ตั้งค่า API');
        setError('กรุณากำหนด API_URL เป็น URL Web App ที่ลงท้ายด้วย /exec');
        return;
      }

      isLoading = true;
      const currentRequest = ++requestNumber;

      // ใช้ชื่อ callback เฉพาะแต่ละครั้ง ป้องกันคำตอบเก่า
      // ทับคำตอบใหม่เมื่อเครือข่ายตอบกลับช้า
      const callbackName = '__balanceCallback' + currentRequest;

      const params = new URLSearchParams();
      if (requestedMonth) params.set('month', requestedMonth);
      if (requestedYear) params.set('year', requestedYear);

      params.set('callback', callbackName);
      params.set('_ts', String(Date.now()));

      let script = null;
      let timeoutId = null;
      let finished = false;

      function cleanup() {
        if (finished) return;
        finished = true;

        clearTimeout(timeoutId);

        if (script) script.remove();

        try {
          delete window[callbackName];
        } catch (_) {
          window[callbackName] = undefined;
        }

        isLoading = false;
      }

      window[callbackName] = function (data) {
        cleanup();

        if (currentRequest < latestRenderedRequest) return;
        latestRenderedRequest = currentRequest;

        if (!data || data.success !== true) {
          setStatus('offline', 'อ่านข้อมูลไม่สำเร็จ');
          setError(data && data.error
            ? data.error
            : 'API ส่งข้อมูลกลับมาไม่ถูกต้อง');
          return;
        }

        renderDashboard(data);
      };

      script = document.createElement('script');
      script.async = true;
      script.src = API_URL + '?' + params.toString();

      script.onerror = function () {
        cleanup();
        setStatus('offline', 'เชื่อมต่อไม่สำเร็จ');
        setError('เรียก API ไม่สำเร็จ กรุณาตรวจ URL และสิทธิ์การ Deploy');
      };

      timeoutId = setTimeout(function () {
        cleanup();
        setStatus('offline', 'API ตอบกลับช้า');
        setError('หมดเวลารอข้อมูล กรุณาตรวจสอบการเชื่อมต่อ');
      }, 15000);

      document.head.appendChild(script);
    }

    // เรียกครั้งแรกทันที จากนั้น polling ทุก 5 วินาที
    loadDashboard();
    timer = setInterval(loadDashboard, POLL_INTERVAL);

    // เมื่อผู้ใช้กลับมาเปิดหน้าเว็บ ให้ดึงข้อมูลใหม่ทันที
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) loadDashboard();
    });
  </script>
</body>
</html>
