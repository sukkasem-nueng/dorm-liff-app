<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการจ่ายเงินประจำเดือน</title>
    <!-- ใช้ Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://line-scdn.net"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-sm">
        <h2 class="text-xl font-bold text-center text-gray-800 mb-6">💰 บันทึกการจ่ายเงินกลุ่ม</h2>
        
        <!-- ส่วนแสดงโปรไฟล์ไลน์ -->
        <div class="flex flex-col items-center mb-6">
            <img id="avatar" class="w-20 h-20 rounded-full border-2 border-green-500 mb-2 hidden" src="" alt="Profile">
            <p class="text-gray-500 text-sm">สวัสดีคุณ</p>
            <p id="displayName" class="text-lg font-semibold text-gray-800">กำลังโหลดข้อมูล...</p>
        </div>

        <!-- ฟอร์มสำหรับส่งข้อมูลเข้า Google Sheets แบบซ่อนไว้ (แก้ปัญหาโหลดช้า/CORS) -->
        <form id="paymentForm" method="POST" target="hidden_iframe" class="space-y-4">
            <input type="hidden" name="name" id="inputName">
            <input type="hidden" name="payType" id="inputPayType">
            
            <button type="button" onclick="submitPayment('เงินโอน')" id="btnTransfer" disabled
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition duration-200 cursor-not-allowed opacity-50 flex justify-center items-center gap-2">
                📱 โอนเงินเรียบร้อยแล้ว
            </button>

            <button type="button" onclick="submitPayment('เงินสด')" id="btnCash" disabled
                class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl transition duration-200 cursor-not-allowed opacity-50 flex justify-center items-center gap-2">
                💵 จ่ายเป็นเงินสดแล้ว
            </button>
        </form>

        <!-- iframe ที่ซ่อนไว้เพื่อรองรับการส่งข้อมูลแบบเบื้องหลัง -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

        <p class="text-center text-xs text-gray-400 mt-6">ระบบจะบันทึกข้อมูลเข้า Google Sheet ทันทีที่กด</p>
    </div>

    <script>
        // 🚨 แก้ไขข้อมูลสำคัญ 2 จุดนี้ 🚨
        const LIFF_ID = 'ใส่_LIFF_ID_ของคุณที่นี่'; 
        const WEB_APP_URL = 'ใส่_WEB_APP_URL_ที่ได้จาก_Google_Apps_Script_ของคุณ';

        let userDisplayName = "";

        // ตั้งค่า URL ปลายทางให้ฟอร์ม
        document.getElementById('paymentForm').action = WEB_APP_URL;

        // เริ่มต้นการทำงานของ LIFF
        async function initLIFF() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    userDisplayName = profile.displayName;
                    
                    document.getElementById('displayName').innerText = userDisplayName;
                    if(profile.pictureUrl) {
                        const avatar = document.getElementById('avatar');
                        avatar.src = profile.pictureUrl;
                        avatar.classList.remove('hidden');
                    }
                    
                    enableButtons();
                }
            } catch (error) {
                console.error("LIFF Initialization failed", error);
                document.getElementById('displayName').innerText = "เกิดข้อผิดพลาดในการโหลดโปรไฟล์";
            }
        }

        function enableButtons() {
            const buttons = [document.getElementById('btnTransfer'), document.getElementById('btnCash')];
            buttons.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('cursor-not-allowed', 'opacity-50');
            });
        }

        // ฟังก์ชันส่งค่าแบบรวดเร็วสะใจ ไม่ติด CORS
        function submitPayment(type) {
            if (!userDisplayName) return alert("ไม่พบข้อมูลชื่อผู้ใช้งาน");
            
            // ใส่ข้อมูลลงในฟอร์มซ่อน
            document.getElementById('inputName').value = userDisplayName;
            document.getElementById('inputPayType').value = type;

            // ล็อคหน้าจอเพื่อไม่ให้กดซ้ำ
            document.body.style.pointerEvents = "none";
            document.body.style.opacity = "0.6";

            // สั่งส่งข้อมูลฟอร์มทันที (ข้อมูลจะยิงเบื้องหลังเข้า iframe โหลดเร็วมากภายใน 0.5 วินาที)
            document.getElementById('paymentForm').submit();

            // แสดงแจ้งเตือนสำเร็จและปิดหน้าจอ LIFF ทันที
            setTimeout(() => {
                alert(`บันทึกสถานะ "${type}" สำเร็จแล้วครับ!`);
                liff.closeWindow();
            }, 500); 
        }

        // รันฟังก์ชันเริ่มต้นเมื่อเปิดหน้าเว็บ
        initLIFF();
    </script>
</body>
</html>
