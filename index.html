<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปยอดเงินกลุ่ม</title>
    <!-- ดึง Tailwind CSS มาช่วยแต่งหน้าจอให้สวยงาม -->
    <script src="https://tailwindcss.com"></script>
    <!-- ดึง LINE LIFF SDK เพื่อเชื่อมต่อกับไลน์ -->
    <script src="https://line-scdn.net"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

    <div class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- ส่วนหัวแสดงโปรไฟล์ผู้เปิดดู (ดึงจาก LINE) -->
        <div id="profile-box" class="flex items-center space-x-3 bg-white p-3 rounded-2xl shadow-sm border border-slate-100 hidden">
            <img id="user-avatar" class="w-10 h-10 rounded-full border border-slate-200" src="" alt="Avatar">
            <div>
                <p class="text-xs text-slate-400">ผู้ตรวจสอบยอด</p>
                <p id="user-name" class="text-sm font-semibold text-slate-700">กำลังโหลด...</p>
            </div>
        </div>

        <!-- 💰 การ์ดแสดงเงินคงเหลือ -->
        <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl p-6 text-white shadow-xl shadow-emerald-100 relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
            <p class="text-sm uppercase tracking-wider text-emerald-100 font-medium">
                คงเหลือ ณ วันที่ <span id="current-date">.........</span>
            </p>
            <p class="text-4xl font-extrabold mt-2 tracking-tight">
                1,200.00 <span class="text-xl font-normal text-emerald-100">บาท</span>
            </p>
        </div>

        <!-- ✅ การ์ดรายชื่อผู้ชำระเงิน -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-4">
            <h3 class="text-md font-bold text-slate-900 flex items-center">
                <span class="mr-2 text-emerald-500">✅</span> ใครจ่ายแล้วบ้าง ?
            </h3>
            
            <div class="divide-y divide-slate-100">
                <!-- นาย A -->
                <div class="py-3 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center font-medium text-slate-600">A</div>
                        <span class="font-medium text-slate-700">นาย A</span>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-green-50 text-green-700 border border-green-200/50">
                        🟢 เงินสด
                    </span>
                </div>

                <!-- นาย B -->
                <div class="py-3 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center font-medium text-slate-600">B</div>
                        <span class="font-medium text-slate-700">นาย B</span>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200/50">
                        🔵 เงินโอน
                    </span>
                </div>
            </div>
        </div>

        <!-- 🔔 ปุ่มกดส่งยอดเข้าแชทกลุ่มไลน์ -->
        <button onclick="sendSummary()" class="w-full bg-slate-950 hover:bg-slate-900 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 active:scale-[0.98]">
            <span>📢 ส่งยอดสรุปนี้เข้าแชทกลุ่ม</span>
        </button>

    </div>

    <!-- ส่วนควบคุมระบบ LINE LIFF และการคำนวณ -->
    <script>
        // 1. ใส่วันที่ปัจจุบันอัตโนมัติ
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('th-TH', options);

        // 2. ตั้งค่าเชื่อมต่อ LINE LIFF
        async function initLiff() {
            try {
                // ⚠️ สำคัญ: นำ LIFF ID จากหน้า LINE Developers มาใส่ตรงนี้แทน "YOUR_LIFF_ID"
                await liff.init({ liffId: "YOUR_LIFF_ID" }); 
                
                if (liff.isLoggedIn()) {
                    getUserProfile();
                } else {
                    liff.login();
                }
            } catch (error) {
                console.error("LIFF การเชื่อมต่อล้มเหลว:", error);
            }
        }

        // ดึงข้อมูลคนเปิดดูมาแสดง
        async function getUserProfile() {
            const profile = await liff.getProfile();
            document.getElementById('profile-box').classList.remove('hidden');
            document.getElementById('user-name').innerText = profile.displayName;
            document.getElementById('user-avatar').src = profile.pictureUrl;
        }

        // 3. ฟังก์ชันส่งข้อความสรุปกลับเข้าไปในแชทกลุ่มที่เปิดอยู่
        async function sendSummary() {
            const dateStr = document.getElementById('current-date').innerText;
            const messageText = `💰 สรุปยอดเงินกลุ่ม\n\n🔹 คงเหลือ ณ วันที่ ${dateStr}\n👉 ยอดเงิน: 1,200.00 บาท\n\n✅ ใครจ่ายแล้วบ้าง ?\n- นาย A (เงินสด)\n- นาย B (เงินโอน)`;

            if (liff.isInClient()) {
                try {
                    await liff.sendMessages([{ type: 'text', text: messageText }]);
                    alert('ส่งข้อความเข้ากลุ่มเรียบร้อยแล้ว!');
                    liff.closeWindow(); // ปิดหน้าต่าง LIFF ทันทีหลังส่งเสร็จ
                } catch (error) {
                    alert('เกิดข้อผิดพลาดในการส่งข้อความ: ' + error.message);
                }
            } else {
                // กรณีเปิดบนเบราว์เซอร์ทั่วไปที่ไม่ได้เปิดผ่านแอป LINE
                alert("ฟังก์ชันส่งเข้าแชทกลุ่มจะทำงานเมื่อเปิดผ่านแอป LINE เท่านั้นครับ\n\nข้อความที่จะส่ง:\n" + messageText);
            }
        }

        // เริ่มทำงานเมื่อโหลดหน้าเว็บ
        initLiff();
    </script>
</body>
</html>
